# Runs the smoke test on every pull request and every push to main.
# Branch protection on main requires this check, so a broken page cannot ship.
name: Smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: for f in js/*.js sw.js; do node --check "$f"; done
      - name: Run the smoke test
        run: python tests/smoke_test.py
