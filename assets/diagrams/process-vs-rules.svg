<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dg-svg" viewBox="0 0 340 300" role="img" aria-labelledby="dgt-pvr"><title id="dgt-pvr">Process vs rules</title><style>.dg-svg{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.dg-svg .bx{fill:#fff;stroke:#8d8d8d;stroke-width:1.4}.dg-svg .bx.hl{fill:#edf5ff;stroke:#0f62fe}.dg-svg .bx.ok{fill:#defbe6;stroke:#24a148}
.dg-svg .bx.bad{fill:#fff1f1;stroke:#da1e28}.dg-svg .bx.warn{fill:#fcf4d6;stroke:#b28600}.dg-svg .bx.agent{fill:#f6f2ff;stroke:#8a3ffc}.dg-svg .bx.soft{fill:#f4f4f4;stroke:#c6c6c6}
.dg-svg .t{fill:#161616;text-anchor:middle}.dg-svg .t.b{font-weight:600}.dg-svg .lbl{fill:#0043ce;font-size:12px;font-weight:600}.dg-svg .note{fill:#525252;font-size:12px}
.dg-svg .ln{stroke:#525252;stroke-width:1.6;fill:none}.dg-svg .ln.dash{stroke-dasharray:5 4}.dg-svg .ahead{fill:#525252}
.dg-svg .ev{fill:#fff;stroke:#24a148;stroke-width:2}.dg-svg .ev.end{stroke:#da1e28;stroke-width:4}.dg-svg .ev.endok{stroke:#24a148;stroke-width:4}.dg-svg .gw{fill:#fcf4d6;stroke:#b28600;stroke-width:1.6}
.dg-svg .tok{fill:#0f62fe}</style><defs><marker id="ah-pvr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker></defs><rect x="8" y="10" width="150" height="34" rx="9" class="bx hl head"/><text x="83" y="32.25" class="t" font-size="15">Process (BPMN)</text><rect x="182" y="10" width="150" height="34" rx="9" class="bx agent head"/><text x="257" y="32.25" class="t" font-size="15">Business rules</text><rect x="8" y="52" width="150" height="170" rx="9" class="bx hl"/><text x="83" y="109.05" class="t" font-size="13">order of steps</text><text x="83" y="125.3" class="t" font-size="13">who does what</text><text x="83" y="141.55" class="t" font-size="13">waits and timers</text><text x="83" y="157.8" class="t" font-size="13">human tasks</text><text x="83" y="174.05" class="t" font-size="13">audit trail</text><rect x="182" y="52" width="150" height="170" rx="9" class="bx agent"/><text x="257" y="109.05" class="t" font-size="13">thresholds</text><text x="257" y="125.3" class="t" font-size="13">eligibility</text><text x="257" y="141.55" class="t" font-size="13">routing</text><text x="257" y="157.8" class="t" font-size="13">decision tables</text><text x="257" y="174.05" class="t" font-size="13">change by analysts</text><path d="M158,112 H180" class="ln" marker-end="url(#ah-pvr)"/><text x="170" y="104" class="lbl" text-anchor="middle">asks</text><path d="M182,160 H160" class="ln" marker-end="url(#ah-pvr)"/><text x="170" y="178" class="lbl" text-anchor="middle">answer</text><text x="170" y="250" class="note" text-anchor="middle">Rule task: the process calls a rule set or decision entity</text><text x="170" y="270" class="note" text-anchor="middle">Change a rule → hot deploy; no process redeploy</text></svg>
